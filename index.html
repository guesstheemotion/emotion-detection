<!DOCTYPE html>
<html>
<head>
  <title>AI Emotion Detection</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>

<body style="text-align:center;font-family:Arial">

<h1>AI Emotion Detection</h1>

<video id="video" width="320" height="240" autoplay muted></video>

<h2 id="emotionText">Emotion: --</h2>
<p id="statusText">Starting...</p>

<script>
const video = document.getElementById("video");
const emotionText = document.getElementById("emotionText");
const statusText = document.getElementById("statusText");

const MODEL_URL =
"https://justadudewhohacks.github.io/face-api.js/models";

async function startApp() {
  try {
    statusText.innerText = "Loading AI model...";

    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);

    statusText.innerText = "Starting camera...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: true
    });

    video.srcObject = stream;
 } catch (error) {
  console.error(error);
  statusText.innerText = "ERROR: " + error.message;
}
}

video.addEventListener("play", () => {
  setInterval(async () => {

    const result = await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions()
      )
      .withFaceExpressions();

    if (result) {
      const expressions = result.expressions;

      const emotion = Object.keys(expressions).reduce(
        (a, b) => expressions[a] > expressions[b] ? a : b
      );

      emotionText.innerText =
        "Emotion: " + emotion.toUpperCase();

      statusText.innerText = "Face detected ✓";
    } else {
      emotionText.innerText = "Emotion: --";
      statusText.innerText = "No face detected";
    }

  }, 500);
});

startApp();
</script>

</body>
</html>
