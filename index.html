<!DOCTYPE html>
<html>
<head>
   <title>Emotion Detection</title>
</head>

</body>
   <h1>AI Emotion Detection</h1>

   <video id="video" width="320 height="240
autoplay></video>
   <h2 id="emotionText">Emotion: _ _</h2>
   <p id="statusText">Starting camera...</p>

   <script>
      const video =
document.getElementById("video");
      const emotionText =
document.getElementById("emotionText");
      const statusText =
document.getElementById("statusText");

      navigator.mediaDevices.getUserMedia( { video:
true } ) 
      .then(stream => {
         video.srcObject = stream;
         statusText.innerText = "Camera strated";
      })
      .catch(error => {
         statusText.innerText = "Camera
permission denied";
      });
   </script>

</body>
</html>
