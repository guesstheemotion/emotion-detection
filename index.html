<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Emotion Detection</title>

  <!-- Face API Library -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    video {
      width: 90%;
      max-width: 500px;
      border-radius: 15px;
      margin-top: 20px;
    }

    #emotionText {
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
    }

    #statusText {
      font-size: 16px;
      color: #555;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>😊 AI Emotion Detection</h1>

  <p>Facial Expression Recognition</p>

  <button onclick="startCamera()">Start Camera</button>

  <br>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <h2 id="emotionText">Emotion: --</h2>

  <p id="statusText">Loading AI model...</p>


  <script>

    const video = document.getElementById("video");
    const emotionText = document.getElementById("emotionText");
    const statusText = document.getElementById("statusText");

    const MODEL_URL =
      "https://justadudewhohacks.github.io/face-api.js/models";


    // Load AI models
    async function loadModels() {

      try {

        statusText.innerText =
          "Loading AI models...";

        await faceapi.nets.tinyFaceDetector.loadFromUri(
          MODEL_URL
        );

        await faceapi.nets.faceExpressionNet.loadFromUri(
          MODEL_URL
        );

        statusText.innerText =
          "AI model ready. Click Start Camera.";

      } catch (error) {

        console.error(error);

        statusText.innerText =
          "Model Error: " + error.message;
      }
    }


    // Start camera
    async function startCamera() {

      try {

        statusText.innerText =
          "Starting camera...";

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

        video.srcObject = stream;

        statusText.innerText =
          "Camera started. Looking for face...";

      } catch (error) {

        console.error(error);

        statusText.innerText =
          "Camera Error: " + error.message;
      }
    }


    // Detect emotion
    video.addEventListener("play", () => {

      setInterval(async () => {

        try {

          const result =
            await faceapi
              .detectSingleFace(
                video,
                new faceapi.TinyFaceDetectorOptions()
              )
              .withFaceExpressions();


          if (result) {

            const expressions =
              result.expressions;


            let emotion = "neutral";
            let highestValue = 0;


            for (const expression in expressions) {

              if (
                expressions[expression] >
                highestValue
              ) {

                highestValue =
                  expressions[expression];

                emotion =
                  expression;
              }
            }


            emotionText.innerText =
              "Emotion: " +
              emotion.toUpperCase();

            statusText.innerText =
              "Face detected ✓";

          } else {

            emotionText.innerText =
              "Emotion: --";

            statusText.innerText =
              "No face detected";
          }

        } catch (error) {

          console.error(error);

          statusText.innerText =
            "Detection Error: " +
            error.message;
        }

      }, 500);

    });


    // Load models when page opens
    loadModels();

  </script>

</body>

</html>
