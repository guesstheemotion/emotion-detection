 <!DOCTYPE html>
<html>
<head>
  <title>AI Emotion Detection</title>

  <!-- Face API -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      text-align: center;
      font-family: Arial;
    }

    video {
      width: 320px;
      height: 240px;
      border: 2px solid black;
    }
  </style>
</head>

<body>

  <h1>AI Emotion Detection</h1>

  <video id="video" autoplay muted></video>

  <h2 id="emotionText">Emotion: --</h2>
  <p id="statusText">Loading...</p>

  <script>

    const video = document.getElementById("video");
    const emotionText = document.getElementById("emotionText");
    const statusText = document.getElementById("statusText");

    // Models कुठून load करायचे
    const MODEL_URL =
      "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";

    async function startApp() {

      statusText.innerText = "Loading AI model...";

      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);

      statusText.innerText = "Starting camera...";

      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          video.srcObject = stream;
          statusText.innerText = "Camera started";
        })
        .catch(error => {
          statusText.innerText = "Camera permission denied";
        });
    }

    video.addEventListener("play", () => {

      setInterval(async () => {

        const detections = await faceapi
          .detectAllFaces(
            video,
            new faceapi.TinyFaceDetectorOptions()
          )
          .withFaceExpressions();

        if (detections.length > 0) {

          const expressions = detections[0].expressions;

          const emotion = Object.keys(expressions).reduce(
            (a, b) => expressions[a] > expressions[b] ? a : b
          );

          emotionText.innerText =
            "Emotion: " + emotion.toUpperCase();

          statusText.innerText = "Face detected ✓";

        } else {

          emotionText.innerText = "Emotion: --";
          statusText.innerText = "No face detected";

        }

      }, 500);

    });

    startApp();

  </script>

</body>
</html>
