<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Emotion Detection</title>

  <!-- Face API Library -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
      margin: 0;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 30px;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
    }

    video {
      width: 90%;
      max-width: 500px;
      border-radius: 15px;
      margin-top: 20px;
      background: black;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      margin-top: 15px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    #emotionText {
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
    }

    #statusText {
      font-size: 16px;
      color: #555;
    }

    #emotionBox {
      width: 90%;
      max-width: 500px;
      margin: 20px auto;
      text-align: left;
    }

    .emotion {
      margin: 12px 0;
    }

    .emotionName {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .barBackground {
      width: 100%;
      height: 18px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      border-radius: 10px;
      background: #555;
      transition: width 0.3s;
    }

    .percentage {
      float: right;
      font-weight: bold;
    }

    #dominantEmotion {
      margin: 25px auto;
      padding: 15px;
      max-width: 500px;
      background: white;
      border-radius: 15px;
      font-size: 22px;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

  </style>

</head>


<body>

  <h1>😊 AI Emotion Detection</h1>

  <p class="subtitle">
    Facial Expression Recognition
  </p>

  <button onclick="startCamera()">
    Start Camera
  </button>

  <br>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <h2 id="emotionText">
    Emotion: --
  </h2>

  <p id="statusText">
    Loading AI model...
  </p>


  <!-- Emotion Percentages -->

  <div id="emotionBox">

    <div class="emotion">

      <div class="emotionName">
        😊 Happy
        <span class="percentage" id="happyValue">--%</span>
      </div>

      <div class="barBackground">
        <div class="bar" id="happyBar"></div>
      </div>

    </div>


    <div class="emotion">

      <div class="emotionName">
        😢 Sad
        <span class="percentage" id="sadValue">--%</span>
      </div>

      <div class="barBackground">
        <div class="bar" id="sadBar"></div>
      </div>

    </div>


    <div class="emotion">

      <div class="emotionName">
        😠 Angry
        <span class="percentage" id="angryValue">--%</span>
      </div>

      <div class="barBackground">
        <div class="bar" id="angryBar"></div>
      </div>

    </div>


    <div class="emotion">

      <div class="emotionName">
        😐 Neutral
        <span class="percentage" id="neutralValue">--%</span>
      </div>

      <div class="barBackground">
        <div class="bar" id="neutralBar"></div>
      </div>

    </div>


    <div class="emotion">

      <div class="emotionName">
        😨 Fear
        <span class="percentage" id="fearValue">--%</span>
      </div>

      <div class="barBackground">
        <div class="bar" id="fearBar"></div>
      </div>

    </div>


    <div class="emotion">

      <div class="emotionName">
        😲 Surprise
        <span class="percentage" id="surpriseValue">--%</span>
      </div>

      <div class="barBackground">
        <div class="bar" id="surpriseBar"></div>
      </div>

    </div>


    <div class="emotion">

      <div class="emotionName">
        🤢 Disgusted
        <span class="percentage" id="disgustedValue">--%</span>
      </div>

      <div class="barBackground">
        <div class="bar" id="disgustedBar"></div>
      </div>

    </div>

  </div>


  <!-- Dominant Emotion -->

  <div id="dominantEmotion">

    Dominant Emotion: --

  </div>


  <script>


    const video =
      document.getElementById("video");

    const emotionText =
      document.getElementById("emotionText");

    const statusText =
      document.getElementById("statusText");


    const MODEL_URL =
      "https://justadudewhohacks.github.io/face-api.js/models";


    // -----------------------------
    // Get HTML Elements
    // -----------------------------

    const emotions = [

      "happy",
      "sad",
      "angry",
      "neutral",
      "fearful",
      "surprised",
      "disgusted"

    ];


    // -----------------------------
    // Load AI Models
    // -----------------------------

    async function loadModels() {

      try {

        statusText.innerText =
          "Loading AI models...";


        await faceapi.nets.tinyFaceDetector.loadFromUri(
          MODEL_URL
        );


        await faceapi.nets.faceExpressionNet.loadFromUri(
          MODEL_URL
        );


        statusText.innerText =
          "AI model ready. Click Start Camera.";


      } catch (error) {

        console.error(error);

        statusText.innerText =
          "Model Error: " +
          error.message;

      }

    }


    // -----------------------------
    // Start Camera
    // -----------------------------

    async function startCamera() {

      try {

        statusText.innerText =
          "Starting camera...";


        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: true,
            audio: false

          });


        video.srcObject = stream;


        statusText.innerText =
          "Camera started. Looking for face...";


      } catch (error) {

        console.error(error);


        statusText.innerText =
          "Camera Error: " +
          error.message;

      }

    }


    // -----------------------------
    // Update Emotion
    // -----------------------------

    function updateEmotion(
      emotion,
      percentage
    ) {

      const valueElement =
        document.getElementById(
          emotion + "Value"
        );


      const barElement =
        document.getElementById(
          emotion + "Bar"
        );


      if (valueElement && barElement) {

        valueElement.innerText =
          percentage.toFixed(1) + "%";


        barElement.style.width =
          percentage + "%";

      }

    }


    // -----------------------------
    // Reset Percentages
    // -----------------------------

    function resetEmotions() {

      emotions.forEach(
        function(emotion) {

          const valueElement =
            document.getElementById(
              emotion + "Value"
            );


          const barElement =
            document.getElementById(
              emotion + "Bar"
            );


          if (valueElement) {

            valueElement.innerText =
              "--%";

          }


          if (barElement) {

            barElement.style.width =
              "0%";

          }

        }
      );

    }


    // -----------------------------
    // Detect Emotion
    // -----------------------------

    video.addEventListener(
      "play",
      () => {

        setInterval(
          async () => {

            try {

              const result =
                await faceapi
                  .detectSingleFace(
                    video,
                    new faceapi.TinyFaceDetectorOptions()
                  )
                  .withFaceExpressions();


              // -----------------------------
              // Face Found
              // -----------------------------

              if (result) {


                const expressions =
                  result.expressions;


                // Happy
                updateEmotion(
                  "happy",
                  expressions.happy * 100
                );


                // Sad
                updateEmotion(
                  "sad",
                  expressions.sad * 100
                );


                // Angry
                updateEmotion(
                  "angry",
                  expressions.angry * 100
                );


                // Neutral
                updateEmotion(
                  "neutral",
                  expressions.neutral * 100
                );


                // Fear
                updateEmotion(
                  "fearful",
                  expressions.fearful * 100
                );


                // Surprise
                updateEmotion(
                  "surprise",
                  expressions.surprised * 100
                );


                // Disgusted
                updateEmotion(
                  "disgusted",
                  expressions.disgusted * 100
                );


                // -----------------------------
                // Find Dominant Emotion
                // -----------------------------

                let emotion =
                  "neutral";


                let highestValue =
                  0;


                for (
                  const expression
                  in expressions
                ) {

                  if (
                    expressions[expression]
                    > highestValue
                  ) {

                    highestValue =
                      expressions[expression];


                    emotion =
                      expression;

                  }

                }


                // -----------------------------
                // Emotion Names
                // -----------------------------

                const emotionNames = {

                  happy: "😊 HAPPY",

                  sad: "😢 SAD",

                  angry: "😠 ANGRY",

                  neutral: "😐 NEUTRAL",

                  fearful: "😨 FEAR",

                  surprised: "😲 SURPRISE",

                  disgusted: "🤢 DISGUSTED"

                };


                const displayEmotion =
                  emotionNames[emotion]
                  || emotion.toUpperCase();


                // Main emotion

                emotionText.innerText =
                  "Emotion: " +
                  displayEmotion;


                // Dominant emotion

                document.getElementById(
                  "dominantEmotion"
                ).innerText =
                  "Dominant Emotion: " +
                  displayEmotion +
                  " (" +
                  (highestValue * 100)
                    .toFixed(1) +
                  "%)";


                statusText.innerText =
                  "Face detected ✓";


              }


              // -----------------------------
              // No Face
              // -----------------------------

              else {

                emotionText.innerText =
                  "Emotion: --";


                document.getElementById(
                  "dominantEmotion"
                ).innerText =
                  "Dominant Emotion: --";


                resetEmotions();


                statusText.innerText =
                  "No face detected";

              }


            } catch (error) {

              console.error(error);


              statusText.innerText =
                "Detection Error: " +
                error.message;

            }

          },
          500
        );

      }
    );


    // -----------------------------
    // Load Models
    // -----------------------------

    loadModels();


  </script>

</body>

</html>
